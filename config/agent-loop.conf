# Agent Loop Configuration

# Maximum retries per story before giving up (can be overridden via CLI arg)
MAX_RETRIES_PER_STORY=5

# Sleep time between iterations (seconds)
SLEEP_BETWEEN_ITERATIONS=2

# Path to PRD file (relative to workspace root)
PRD_FILE="data/prd.json"

# Path to progress log (relative to workspace root)
PROGRESS_FILE="data/progress.txt"

# Path to system prompt (relative to workspace root)
SYSTEM_PROMPT="prompts/system-prompt.md"

# Archive directory for previous runs
ARCHIVE_DIR="data/archive"

# AI Provider Configuration
# Options: "openai" or "openrouter"
AI_PROVIDER="openai"

# Model selection per provider
OPENAI_MODEL="openai/gpt-5.2-codex"
OPENROUTER_MODEL="openrouter/x-ai/grok-code-fast-1"
